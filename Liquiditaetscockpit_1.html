<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquiditätscockpit</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --pos:#2a78d6; --neg:#e34948;
  --good:#006300; --bad:#d03b3b; --warn:#fab219; --ok:#0ca30c;
  --chip:rgba(11,11,11,.05); --chip2:rgba(11,11,11,.09);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --pos:#3987e5; --neg:#e66767;
  --good:#0ca30c; --bad:#d03b3b; --warn:#fab219; --ok:#0ca30c;
  --chip:rgba(255,255,255,.07); --chip2:rgba(255,255,255,.13);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
    --pos:#3987e5; --neg:#e66767;
    --good:#0ca30c; --bad:#d03b3b; --warn:#fab219; --ok:#0ca30c;
    --chip:rgba(255,255,255,.07); --chip2:rgba(255,255,255,.13);
  }
}

/* Druck / PDF: nur der Inhalt, keine Bedienelemente, keine Seitenumbrüche mitten im Bild */
@media print{
  :root{ --page:#fff; --surface:#fff; --ink:#000; --ink2:#333; --muted:#555;
         --grid:#ddd; --axis:#bbb; --ring:#ccc; --chip:#f2f2f2; --chip2:#e8e8e8 }
  body{background:#fff}
  .appbar .inner .row, .tabs, .drop, .btn, .seg, details.tbl summary{display:none !important}
  .appbar{position:static;border:0;padding:0}
  .wrap{max-width:none;padding:0}
  .card{break-inside:avoid;page-break-inside:avoid;border-color:#ddd;box-shadow:none}
  .grid2{display:block}
  .grid2>section{margin-bottom:10px}
  .scroll{max-height:none !important;overflow:visible !important}
  details.tbl[open] div{max-height:none !important}
  .toast,.tt,.modalbg{display:none !important}
  a{color:inherit;text-decoration:none}
  @page{ margin:14mm }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 72px}

/* Kopf */
.appbar{position:sticky;top:0;z-index:30;background:var(--page);border-bottom:1px solid var(--grid);
  padding:12px 0 0;margin-bottom:20px}
.appbar .inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{font-size:16px;font-weight:680;letter-spacing:-.01em;margin-right:6px}
.brand small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;margin:10px auto 0;max-width:1280px;padding:0 20px;width:100%}
.tabs button{border:0;background:transparent;color:var(--ink2);padding:9px 14px;border-radius:8px 8px 0 0;
  cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:640;border-bottom-color:var(--s1)}
.tabs button:hover{background:var(--chip)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:10px;
  background:var(--warn);color:#000;font-size:11px;font-weight:700;text-align:center}
.spacer{flex:1}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px 18px}
.card+.card{margin-top:12px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:14.5px;margin:0 0 2px;font-weight:650}
h3{font-size:13px;margin:18px 0 8px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink2);font-size:13px;
  padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:7px 14px;
  border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:13px}
input:focus,select:focus{outline:2px solid var(--s1);outline-offset:-1px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.grid2>.full{grid-column:1/-1}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.kpi .lab{color:var(--ink2);font-size:12.5px;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.kpi .kpisub{font-size:12.5px;color:var(--muted);margin-top:5px}
.up{color:var(--good)} .down{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
svg{display:block;width:100%;overflow:visible}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:7px 8px;
  border-bottom:1px solid var(--grid);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--chip)}
tr.sel{background:var(--chip2)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--chip);font-size:11.5px;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px;flex:none}
.sub{color:var(--muted);font-size:11.5px}
.scroll{max-height:520px;overflow:auto}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ring);border-left:3px solid var(--warn);
  border-radius:9px;padding:11px 14px;background:var(--surface);margin-top:10px;font-size:13px}
.note.ok{border-left-color:var(--ok)} .note.bad{border-left-color:var(--bad)} .note.info{border-left-color:var(--s1)}
.note .ic{font-weight:700;color:var(--warn);flex:none} .note.ok .ic{color:var(--ok)}
.note.bad .ic{color:var(--bad)} .note.info .ic{color:var(--s1)}
.drop{border:2px dashed var(--axis);border-radius:14px;padding:38px 20px;text-align:center;color:var(--ink2);
  background:var(--surface);cursor:pointer;transition:.12s}
.drop.over{border-color:var(--s1);background:var(--chip)}
.drop b{display:block;font-size:15px;color:var(--ink);margin-bottom:6px}
.tt{position:fixed;top:0;left:0;pointer-events:none;background:var(--surface);border:1px solid var(--ring);
  border-radius:9px;padding:9px 11px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.16);
  opacity:0;transition:opacity .1s;z-index:80;min-width:150px;will-change:transform}

/* Gesellschaftsleiste – immer sichtbar, Gruppe inklusive */
.firmleiste{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:10px}
.ftile{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  background:var(--surface);border:1px solid var(--ring);border-radius:11px;padding:12px 14px;cursor:pointer}
.ftile:hover{border-color:var(--axis)}
.ftile.aktiv{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.ftile.gesamt{background:var(--chip)}
.fname{font-size:12.5px;color:var(--ink2);display:flex;align-items:center}
.fwert{font-size:19px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.fdelta{font-size:12px}
/* Verlauf als kleine Einzeldiagramme mit eigener Skala */
.minigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:10px}
.minicard{border:1px solid var(--ring);border-radius:10px;padding:9px 10px 4px;cursor:pointer}
.minicard:hover{border-color:var(--axis)}
.minicard.aktiv{border-color:var(--s1)}
.minikopf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:2px}
th.gesamt,td.gesamt{background:var(--chip);font-weight:600}
.tt b{display:block;margin-bottom:5px}
.tt .r{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--page);
  padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:90;opacity:0;transition:.2s;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.25);max-width:90vw}
.toast.show{opacity:1}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.modalbg.show{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:20px 22px;max-width:620px;width:100%;
  max-height:86vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.3)}
details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--ink2);font-size:12.5px}
footer{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--grid);padding-top:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;
  background:var(--chip);color:var(--ink2)}
.pill.ok{background:rgba(12,163,12,.14);color:var(--good)}
.pill.bad{background:rgba(208,59,59,.14);color:var(--bad)}
.pill.warn{background:rgba(250,178,25,.18);color:#7a5400}
:root[data-theme="dark"] .pill.warn{color:#fab219}
.hide{display:none !important}
.mono{font-variant-numeric:tabular-nums}
.stepline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.stepline b{color:var(--ink)}
</style>
</head>
<body>
<div class="appbar">
  <div class="inner">
    <div class="brand">Liquiditätscockpit<small id="brandSub">Firmengruppe</small></div>
    <div class="spacer"></div>
    <div class="row">
      <button class="btn" id="btnLaden">Datenstand laden</button>
      <button class="btn primary" id="btnSichern">Datenstand sichern</button>
      <button class="btn" id="btnDruck" title="Aktuelle Ansicht drucken oder als PDF sichern">Drucken</button>
      <button class="btn" id="btnTheme" title="Hell / Dunkel">◐</button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="uebersicht">Übersicht</button>
    <button role="tab" data-tab="stroeme">Geldströme</button>
    <button role="tab" data-tab="import">Kontoauszug einlesen</button>
    <button role="tab" data-tab="buchungen">Buchungen</button>
    <button role="tab" data-tab="abgrenzung">Jahresabgrenzung<span class="badge hide" id="badgeAbgr">0</span></button>
    <button role="tab" data-tab="einstellungen">Einstellungen</button>
  </div>
</div>

<div class="wrap">
  <section id="tab-uebersicht"></section>
  <section id="tab-stroeme" class="hide"></section>
  <section id="tab-import" class="hide"></section>
  <section id="tab-buchungen" class="hide"></section>
  <section id="tab-abgrenzung" class="hide"></section>
  <section id="tab-einstellungen" class="hide"></section>
  <footer id="foot"></footer>
</div>

<div class="tt" id="tt"></div>
<div class="toast" id="toast"></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>

}

}

let S = leererStand();

/* ---------- Rechenindex ---------------------------------------------------
   Wird einmal je Datenänderung aufgebaut. Ohne ihn werden dieselben Summen
   bei jedem Neuzeichnen erneut über alle Buchungen gerechnet – das ist der
   Unterschied zwischen flüssig und zäh.                                     */
let IDX = null;
function indexBauen(){
  const sortiert = S.buchungen.slice().sort((a,b) => a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0);
  const saldo = {}, proFirma = {};
  for(const k of S.konten){ saldo[k.konto_id] = +k.eroeffnungssaldo || 0; }
  const kontoFirma = {}; S.konten.forEach(k => kontoFirma[k.konto_id] = k.firma_id);
  for(const f of S.firmen) proFirma[f.id] = [];
  for(const b of sortiert){
    if(saldo[b.konto_id] === undefined) saldo[b.konto_id] = 0;
    saldo[b.konto_id] += b.betrag;
    const fid = kontoFirma[b.konto_id];
    if(proFirma[fid]) proFirma[fid].push(b);
  }
  const daten = sortiert.length ? sortiert[sortiert.length-1].datum : heute();
  const start = [...S.konten.map(k => k.eroeffnungsdatum).filter(Boolean),
                 ...(sortiert.length ? [sortiert[0].datum] : [])].sort()[0] || S.einstellungen.jahresstart;
  IDX = { sortiert, saldo, proFirma, kontoFirma, ende: daten, start, vorschlaege: null, reihen: {} };
  return IDX;
}
const idx = () => IDX || indexBauen();

/* ---------- Formate ------------------------------------------------------ */
const eur = (n,d=0) => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const eurK = n => Math.abs(n)>=1000 ? new Intl.NumberFormat("de-DE",{maximumFractionDigits:0}).format(Math.round(n/1000))+" T€"
                                    : new Intl.NumberFormat("de-DE",{maximumFractionDigits:0}).format(n||0)+" €";
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONLANG = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const dstr = s => s ? s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(2,4) : "";
const dlang = s => s ? s.slice(8,10)+". "+MONLANG[+s.slice(5,7)-1]+" "+s.slice(0,4) : "";
const mlabel = ym => ym ? MON[+ym.slice(5,7)-1]+" "+ym.slice(2,4) : "";
const heute = () => new Date().toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const addMon = (ym,n) => { let j=+ym.slice(0,4), m=+ym.slice(5,7)+n; while(m<1){m+=12;j--;} while(m>12){m-=12;j++;} return j+"-"+String(m).padStart(2,"0"); };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/\s+/g," ").trim();

/** Deutsche und englische Zahlformate robust einlesen. */
function zahl(v){
  if(typeof v === "number") return v;
  let s = String(v==null?"":v).trim().replace(/\s| |'|€|EUR/gi,"");
  if(!s) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  if(/-$/.test(s)){ neg = true; s = s.slice(0,-1); }
  const hatK = s.includes(","), hatP = s.includes(".");
  if(hatK && hatP)      s = (s.lastIndexOf(",") > s.lastIndexOf(".")) ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if(hatK)         s = s.replace(/\./g,"").replace(",",".");
  else if(hatP && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = parseFloat(s);
  return isNaN(n) ? NaN : (neg ? -Math.abs(n) : n);
}

/** Datum in ISO. Erkennt TT.MM.JJJJ, TT.MM.JJ, JJJJ-MM-TT, TT/MM/JJJJ, JJMMTT. */
function datum(v){
  if(!v) return null;
  const s = String(v).trim();
  let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)))            return `${m[1]}-${m[2]}-${m[3]}`;
  if((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/))) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  if((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2})$/))) return `20${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  if((m = s.match(/^(\d{2})(\d{2})(\d{2})$/)))             return `20${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString().slice(0,10);
}

/* ---------- Zugriffshelfer ----------------------------------------------- */
const katById   = id => S.kategorien.find(k => k.id === id) || {id:"offen",name:"Nicht zugeordnet",typ:"offen"};

const FARBEN = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
const farbeFirma = id => FARBEN[Math.max(0, S.firmen.findIndex(f => f.id === id)) % FARBEN.length];

const kontenVon = f => S.konten.filter(k => f === "alle" || k.firma_id === f);
function buchungenVon(f, von, bis){
  const I = idx();
  const liste = f === "alle" ? I.sortiert : (I.proFirma[f] || []);
  if(!von && !bis) return liste;
  return liste.filter(b => (!von || b.datum >= von) && (!bis || b.datum <= bis));
}
const eroeffnung = f => kontenVon(f).reduce((s,k) => s + (+k.eroeffnungssaldo||0), 0);
function saldoAm(f, d){
  let s = eroeffnung(f);
  for(const b of buchungenVon(f)){ if(b.datum > d) break; s += b.betrag; }
  return s;
}
const saldoKonto = id => idx().saldo[id] !== undefined ? idx().saldo[id] : (+(kontoById(id)||{}).eroeffnungssaldo || 0);
/** Monat, dem eine Buchung in der Auswertung zugerechnet wird. */
const periodeVon = b => (S.einstellungen.basis === "periode" && b.periode) ? b.periode : b.datum.slice(0,7);
const datenStart = () => idx().start;
const datenEnde  = () => idx().ende;

/* ---------- Speichern / Laden -------------------------------------------- */
function download(name, text, typ){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: typ || "application/json;charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function standSichern(){
  const n = "Liquiditaet-Datenstand-" + heute() + ".json";
  download(n, JSON.stringify(S, null, 1));
  toast("Datenstand gesichert: " + n);
}
function standLaden(text){
  let neu;
  try { neu = JSON.parse(text); } catch(e){ return toast("Die Datei ist kein gültiger Datenstand."); }
  if(!neu || !Array.isArray(neu.buchungen) || !Array.isArray(neu.konten)) return toast("Die Datei enthält keinen Datenstand.");
  neu.einstellungen = Object.assign(leererStand().einstellungen, neu.einstellungen || {});
  neu.kategorien = (neu.kategorien && neu.kategorien.length) ? neu.kategorien : leererStand().kategorien;
  neu.firmen = (neu.firmen && neu.firmen.length) ? neu.firmen : leererStand().firmen;
  neu.buchungen.forEach((b,i) => { if(!b.id) b.id = "b"+i; if(b.periode === undefined) b.periode = null; });
  S = neu; UI.sel.clear();
  toast(`Datenstand geladen: ${S.buchungen.length} Buchungen, ${S.konten.length} Konten.`);
  renderAll();
}

/* ---------- Automatische Kategorie-Zuordnung ------------------------------ */
function kategorieRaten(gegenpartei, zweck){
  const t = norm(gegenpartei + " " + zweck);
  let treffer = null, laenge = 0;
  for(const k of S.kategorien){
    for(const r of (k.regeln || [])){
      const rr = norm(r);
      if(rr && t.includes(rr) && rr.length > laenge){ treffer = k.id; laenge = rr.length; }
    }
  }
  return treffer || "offen";
}
/** Merkt sich eine Zuordnung als Regel (aus dem Namen der Gegenpartei). */
function regelMerken(katId, gegenpartei){
  const k = S.kategorien.find(x => x.id === katId); if(!k) return false;
  let r = norm(gegenpartei).replace(/\b(gmbh|ag|kg|ohg|se|mbh|e\.?v\.?|co\.?|deutschland|ltd|inc)\b/g,"").trim();
  r = r.split(/[,/|]/)[0].trim();
  if(r.length < 4) return false;
  k.regeln = k.regeln || [];
  if(!k.regeln.some(x => norm(x) === r)){ k.regeln.push(r); return true; }
  return false;
}

/* ---------- Jahresabgrenzung --------------------------------------------- */
/* Nur die Kategorien, die typischerweise im Nachhinein gezahlt werden.
   Miete, Leasing, Versicherung werden im Voraus gezahlt und gehören in den Zahlungsmonat. */
const ABGR_KAT = ["personal","soziales","steuern"];
/** Sucht im Verwendungszweck einen Monat wie 12/2025, 12.25, Dezember 2025, Q4/2025. */
const RE_MONJAHR  = /\b(0[1-9]|1[0-2])\s*[\/.\-]\s*(20\d{2})\b/;
const RE_MONKURZ  = /\b(0[1-9]|1[0-2])\s*[\/.\-]\s*(\d{2})\b/;
const RE_QUARTAL  = /\bq([1-4])\s*[\/.\-]?\s*(20\d{2})\b/;
const RE_MONNAME  = MONLANG.map(m => new RegExp("\\b" + m.toLowerCase() + "\\s*(20\\d{2})?\\b"));
function periodeAusText(text, refDatum){
  const t = norm(text); let m;
  if((m = t.match(RE_MONJAHR)))  return `${m[2]}-${m[1]}`;
  if((m = t.match(RE_MONKURZ)))  return `20${m[2]}-${m[1]}`;
  for(let i=0;i<12;i++){
    if((m = t.match(RE_MONNAME[i]))){
      const jahr = m[1] || (i+1 > +refDatum.slice(5,7) ? (+refDatum.slice(0,4)-1) : refDatum.slice(0,4));
      return `${jahr}-${String(i+1).padStart(2,"0")}`;
    }
  }
  if((m = t.match(RE_QUARTAL))) return `${m[2]}-${String(+m[1]*3).padStart(2,"0")}`;
  return null;
}
/** Liefert Vorschläge zur Jahres-/Monatszuordnung für noch nicht entschiedene Buchungen. */
function abgrenzungsVorschlaege(){
  const I = idx();
  if(I.vorschlaege) return I.vorschlaege;
  if(S.einstellungen.basis === "zahlung") return I.vorschlaege = [];
  const start = S.einstellungen.jahresstart;
  const out = [];
  for(const b of S.buchungen){
    if(b.periode || b.abgrErledigt) continue;
    const eigen = b.datum.slice(0,7);
    let vor = null, grund = "";
    const ausText = periodeAusText(b.verwendungszweck + " " + b.gegenpartei, b.datum);
    if(ausText){
      // Nennt der Verwendungszweck den Zahlungsmonat selbst, ist alles in Ordnung.
      if(ausText === eigen) continue;
      if(ausText < eigen && ausText >= addMon(eigen,-4)){
        vor = ausText; grund = "Verwendungszweck nennt " + mlabel(ausText);
      }
    } else if(b.datum >= start && b.datum <= addDays(start, 17) && ABGR_KAT.includes(b.kategorie)){
      vor = addMon(eigen,-1); grund = "typische Nachzahlung für den Vormonat";
    }
    if(vor) out.push({ id:b.id, vorschlag:vor, grund });
  }
  return I.vorschlaege = out.sort((a,b) => a.vorschlag < b.vorschlag ? -1 : 1);
}

function formatErkennen(text, name){
  const t = text.slice(0, 4000);
  if(t.startsWith("%PDF")) return "pdf";
  if(t.startsWith("PK") && /\.(xlsx|xlsm|ods)$/i.test(name||"")) return "excel";
  if(/\.(xls|xlsx|xlsm|ods)$/i.test(name||"")) return "excel";
  if(/<\?xml|<Document|camt\.05/i.test(t)) return "camt";
  if(/(^|\n)\s*:20:/.test(text) && /(^|\n)\s*:61:/.test(text)) return "mt940";
  if(/\.(sta|940)$/i.test(name || "")) return "mt940";
  return "csv";
}

/* ---- CSV ---- */
function csvTrennerRaten(text){
  const z = text.split(/\r?\n/).filter(x => x.trim()).slice(0,12);
  let best = ";", bestScore = -1;
  for(const t of [";", "\t", ",", "|"]){
    const counts = z.map(l => l.split(t).length);
    const c0 = counts[0] || 0;
    const gleich = counts.filter(c => c === c0).length;
    const score = (c0 > 1 ? c0 : 0) * 10 + gleich;
    if(c0 > 1 && score > bestScore){ bestScore = score; best = t; }
  }
  return best;
}
function csvZeilen(text, trenner){
  const out = []; let feld = "", zeile = [], q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ feld += '"'; i++; } else q = false; }
      else feld += c;
    } else if(c === '"') q = true;
    else if(c === trenner){ zeile.push(feld); feld = ""; }
    else if(c === "\n"){ zeile.push(feld); out.push(zeile); zeile = []; feld = ""; }
    else if(c !== "\r") feld += c;
  }
  if(feld.length || zeile.length){ zeile.push(feld); out.push(zeile); }
  return out.filter(z => z.some(f => String(f).trim() !== ""));
}
const SPALTEN_MUSTER = {
  datum:   ["buchungstag","buchungsdatum","buchung","datum","belegdatum","date"],
  valuta:  ["valuta","wertstellung","wert","valutadatum","value date"],
  betrag:  ["betrag","umsatz","betrag in eur","amount","wert in eur","soll/haben betrag"],
  soll:    ["soll","belastung","abgang","debit"],
  haben:   ["haben","gutschrift","zugang","credit"],
  vz:      ["soll/haben","s/h","vorzeichen","soll-haben-kennzeichen","cdtdbtind"],
  partner: ["beguenstigter","begünstigter","auftraggeber","empfänger","empfaenger","zahlungsempfänger",
            "beguenstigter/zahlungspflichtiger","begünstigter/zahlungspflichtiger","name","zahlungspflichtiger",
            "kontoinhaber","partnername","gegenkonto inhaber"],
  zweck:   ["verwendungszweck","buchungstext","vwz","text","zweck","beschreibung","umsatztext","verwendung"],
  konto:   ["auftragskonto","eigenkonto","auftraggeberkonto"]
};
function spaltenRaten(kopf){
  const k = kopf.map(x => norm(x).replace(/[.:]/g,""));
  const map = {};
  for(const feld in SPALTEN_MUSTER){
    let idx = -1, best = 0;
    k.forEach((h,i) => {
      for(const muster of SPALTEN_MUSTER[feld]){
        if(h === muster && muster.length > best){ idx = i; best = muster.length + 100; }
        else if(h.includes(muster) && muster.length > best){ idx = i; best = muster.length; }
      }
    });
    if(idx >= 0) map[feld] = idx;
  }
  return map;
}
function parseCSV(text, name){
  const trenner = csvTrennerRaten(text);
  let zeilen = csvZeilen(text, trenner);
  if(!zeilen.length) return { fehler:"Die Datei enthält keine lesbaren Zeilen." };
  // Kopfzeile suchen: die erste Zeile, in der mindestens zwei bekannte Spalten stecken
  let kopfIdx = 0, map = spaltenRaten(zeilen[0]);
  for(let i=0;i<Math.min(zeilen.length,12);i++){
    const m = spaltenRaten(zeilen[i]);
    const gut = (m.datum!=null) && (m.betrag!=null || (m.soll!=null||m.haben!=null));
    if(gut){ kopfIdx = i; map = m; break; }
  }
  // Eigenes Konto steht bei vielen Exporten im Vorspann über der Kopfzeile
  let eigenKonto = "";
  const vorspann = zeilen.slice(0, kopfIdx).flat().join(" ") + " " + text.slice(0, 600);
  const mi = vorspann.match(/\b([A-Z]{2}\d{2}[\s]?[0-9A-Z\s]{10,32})\b/);
  if(mi) eigenKonto = mi[1].replace(/\s/g,"");
  else { const mk = vorspann.match(/konto(?:nummer)?\s*:?\s*([\d\s.\-]{6,20})/i); if(mk) eigenKonto = mk[1].trim(); }
  return { art:"csv", trenner, kopf: zeilen[kopfIdx], zeilen: zeilen.slice(kopfIdx+1), map, name, eigenKonto };
}
function csvBuchungen(p){
  const m = p.map, out = [];
  for(const z of p.zeilen){
    const d = datum(z[m.datum]);
    if(!d) continue;
    let betrag = NaN;
    if(m.betrag != null) betrag = zahl(z[m.betrag]);
    if(isNaN(betrag) && (m.soll != null || m.haben != null)){
      const s = m.soll  != null ? zahl(z[m.soll])  : NaN;
      const h = m.haben != null ? zahl(z[m.haben]) : NaN;
      betrag = !isNaN(h) && h !== 0 ? Math.abs(h) : (!isNaN(s) && s !== 0 ? -Math.abs(s) : NaN);
    }
    if(isNaN(betrag)) continue;
    if(m.vz != null){
      const v = norm(z[m.vz]);
      if(/^(s|d|dbit|soll|debit)$/.test(v)) betrag = -Math.abs(betrag);
      if(/^(h|c|crdt|haben|credit)$/.test(v)) betrag = Math.abs(betrag);
    }
    out.push({
      datum: d,
      betrag: Math.round(betrag*100)/100,
      gegenpartei: (m.partner != null ? String(z[m.partner]||"") : "").trim() || "ohne Angabe",
      verwendungszweck: (m.zweck != null ? String(z[m.zweck]||"") : "").replace(/\s+/g," ").trim(),
      kontoHinweis: m.konto != null ? String(z[m.konto]||"").trim() : ""
    });
  }
  return out;
}

/* ---- MT940 ---- */
function parseMT940(text){
  const roh = text.replace(/\r/g,"").split("\n");
  const felder = [];
  for(const l of roh){
    if(/^:\d{2}[A-Z]?:/.test(l)) felder.push(l);
    else if(felder.length) felder[felder.length-1] += l;
    }
  const ausz = []; let a = null;
  const saldo = s => { const m = s.match(/^([CD])(\d{6})([A-Z]{3})([\d,.]+)/);
    if(!m) return null;
    return { datum: datum(m[2]), betrag: (m[1] === "D" ? -1 : 1) * zahl(m[4]) }; };
  for(const f of felder){
    const tag = f.slice(1, f.indexOf(":",1));
    const val = f.slice(f.indexOf(":",1)+1);
    if(tag === "20" || tag === "25"){
      if(tag === "25"){ if(!a) a = {umsaetze:[]}; a.konto = val.trim(); }
      else { if(a && a.umsaetze.length) ausz.push(a); a = {umsaetze:[]}; }
    }
    if(!a) a = {umsaetze:[]};
    if(tag === "60F" || tag === "60M") a.anfang = saldo(val);
    if(tag === "62F" || tag === "62M") a.ende   = saldo(val);
    if(tag === "61"){
      const m = val.match(/^(\d{6})(\d{4})?(RC|RD|C|D)([A-Z])?([\d,.]+)/);
      if(m){
        const vd = datum(m[1]);
        let bd = vd;
        if(m[2]) bd = `${vd.slice(0,4)}-${m[2].slice(0,2)}-${m[2].slice(2,4)}`;
        if(bd > addDays(vd, 40)) bd = `${+vd.slice(0,4)-1}-${bd.slice(5)}`;
        const soll = m[3] === "D" || m[3] === "RC";
        a.umsaetze.push({ datum: bd, betrag: (soll?-1:1)*zahl(m[5]), gegenpartei:"", verwendungszweck:"" });
      }
    }
    if(tag === "86" && a.umsaetze.length){
      const u = a.umsaetze[a.umsaetze.length-1];
      if(/\?\d{2}/.test(val)){
        const teile = {}; let re, rex = /\?(\d{2})([^?]*)/g;
        while((re = rex.exec(val))) teile[re[1]] = (teile[re[1]]||"") + re[2];
        const zw = []; for(let i=20;i<=29;i++) if(teile[String(i)]) zw.push(teile[String(i)]);
        for(let i=60;i<=63;i++) if(teile[String(i)]) zw.push(teile[String(i)]);
        u.verwendungszweck = zw.join(" ").replace(/\s+/g," ").trim();
        u.gegenpartei = ((teile["32"]||"") + " " + (teile["33"]||"")).replace(/\s+/g," ").trim();
        if(!u.gegenpartei && teile["00"]) u.gegenpartei = teile["00"].trim();
      } else {
        u.verwendungszweck = val.replace(/\s+/g," ").trim();
      }
      if(!u.gegenpartei) u.gegenpartei = "ohne Angabe";
    }
  }
  if(a && a.umsaetze.length) ausz.push(a);
  if(!ausz.length) return { fehler:"In der MT940-Datei wurden keine Umsätze gefunden." };
  return { art:"mt940", auszuege: ausz };
}

/* ---- CAMT.053 ----
   Bewusst ohne CSS-Selektoren: Banken liefern die Datei mal mit, mal ohne
   Namensraum-Präfix. Gesucht wird deshalb immer über den lokalen Elementnamen. */
const lokale = (el, name) => [...el.getElementsByTagName("*")].filter(x => x.localName === name);
const erstes = (el, name) => { const r = lokale(el, name); return r.length ? r[0] : null; };
const ltext  = (el, name) => { const r = erstes(el, name); return r ? r.textContent.trim() : ""; };

function parseCAMT(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) return { fehler:"Die XML-Datei konnte nicht gelesen werden." };
  const stmts = lokale(doc.documentElement, "Stmt").concat(doc.documentElement.localName === "Stmt" ? [doc.documentElement] : []);
  if(!stmts.length) return { fehler:"Die Datei enthält keinen Kontoauszug (Stmt)." };
  const ausz = [];
  for(const st of stmts){
    const kind = n => [...st.children].filter(c => c.localName === n);
    const acct = erstes(st, "Acct");
    const a = { konto: acct ? (ltext(acct,"IBAN") || ltext(acct,"Id")) : "", umsaetze: [] };
    for(const bal of kind("Bal")){
      const cd = ltext(bal, "Cd") || ltext(bal, "Prtry");
      const amt = erstes(bal, "Amt");
      const vz = ltext(bal, "CdtDbtInd") === "DBIT" ? -1 : 1;
      const wert = { datum: datum(ltext(bal, "Dt") || ltext(bal, "DtTm")), betrag: vz * zahl(amt ? amt.textContent : 0) };
      if(cd === "OPBD" || cd === "PRCD") a.anfang = wert;
      if(cd === "CLBD") a.ende = wert;
    }
    for(const e of kind("Ntry")){
      const amt = [...e.children].find(c => c.localName === "Amt") || erstes(e, "Amt");
      const soll = ltext(e, "CdtDbtInd") === "DBIT";
      const bookg = erstes(e, "BookgDt"), vald = erstes(e, "ValDt");
      const d = datum((bookg ? bookg.textContent.trim() : "") || (vald ? vald.textContent.trim() : ""));
      if(!d) continue;
      const partei = erstes(e, "Cdtr") || erstes(e, "Dbtr");
      const nm = partei ? ltext(partei, "Nm") || partei.textContent.trim() : "";
      const ustrd = lokale(e, "Ustrd").map(x => x.textContent.trim());
      const info  = lokale(e, "AddtlNtryInf").map(x => x.textContent.trim());
      a.umsaetze.push({
        datum: d,
        betrag: (soll?-1:1) * zahl(amt ? amt.textContent : 0),
        gegenpartei: nm || "ohne Angabe",
        verwendungszweck: (ustrd.join(" ") || info.join(" ")).replace(/\s+/g," ").trim()
      });
    }
    if(a.umsaetze.length) ausz.push(a);
  }
  if(!ausz.length) return { fehler:"Die Datei enthält keine Umsätze." };
  return { art:"camt", auszuege: ausz };
}

/* ---- Konto anhand der Kennung aus der Datei finden ---- */
function kontoRaten(kennung){
  const k = String(kennung||"").replace(/\s/g,"").toUpperCase();
  if(!k) return "";
  const ziffern = k.replace(/\D/g,"");
  for(const kk of S.konten){
    const ik = String(kk.iban||"").replace(/\s|\*/g,"").toUpperCase();
    const iz = ik.replace(/\D/g,"");
    if(ik && k === ik) return kk.konto_id;
    if(iz.length >= 4 && ziffern.length >= 4 && (ziffern.endsWith(iz.slice(-4)) || iz.endsWith(ziffern.slice(-4)))) return kk.konto_id;
  }
  return "";
}

/* ---------- Kurzinfo am Zeiger -------------------------------------------
   Bewusst über requestAnimationFrame und ohne Messen der eigenen Größe bei
   jeder Mausbewegung – sonst rechnet der Browser bei jedem Pixel das Layout
   neu, und genau das fühlt sich zäh an.                                     */
const tt = $("tt");
let ttWunsch = null, ttLaeuft = false, ttMass = {w:200,h:80};
function showTT(x, y, html){
  ttWunsch = {x, y, html};
  if(ttLaeuft) return;
  ttLaeuft = true;
  requestAnimationFrame(() => {
    ttLaeuft = false;
    if(!ttWunsch) return;
    const w = ttWunsch; ttWunsch = null;
    if(tt._html !== w.html){ tt.innerHTML = w.html; tt._html = w.html; ttMass = {w:tt.offsetWidth, h:tt.offsetHeight}; }
    tt.style.opacity = 1;
    tt.style.transform = `translate(${Math.min(innerWidth - ttMass.w - 10, Math.max(8, w.x + 14))}px,` +
                         `${Math.max(8, w.y - ttMass.h - 12)}px)`;
  });
}
function hideTT(){ ttWunsch = null; tt.style.opacity = 0; }

/* ---------- Diagramme ---------------------------------------------------- */
const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (n,a={}) => { const e = document.createElementNS(SVGNS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };
function niceTicks(min,max,n=5){
  if(min === max){ min -= 1; max += 1; }
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const t = []; for(let v = lo; v <= hi + step/2; v += step) t.push(v);
  return { ticks:t, lo, hi };
}

function lineChart(host, series){
  host.innerHTML = "";
  const W = host.clientWidth || 900, H = 290, P = {t:12,r:16,b:26,l:70};
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`, height:H}); host.appendChild(svg);
  const pts = series.flatMap(s => s.points); if(!pts.length) return;
  const ys = pts.map(p => p.y);
  const {ticks,lo,hi} = niceTicks(Math.min(0,...ys), Math.max(...ys), 5);
  const n = series[0].points.length;
  const X = i => P.l + (W-P.l-P.r) * (n<2 ? .5 : i/(n-1));
  const Y = v => P.t + (H-P.t-P.b) * (1 - (v-lo)/(hi-lo||1));
  for(const t of ticks){
    svg.appendChild(svgEl("line",{x1:P.l,x2:W-P.r,y1:Y(t),y2:Y(t),stroke:"var(--grid)","stroke-width":1}));
    const tx = svgEl("text",{x:P.l-9,y:Y(t)+4,"text-anchor":"end",fill:"var(--muted)","font-size":11.5}); tx.textContent = eurK(t); svg.appendChild(tx);
  }
  if(lo < 0) svg.appendChild(svgEl("line",{x1:P.l,x2:W-P.r,y1:Y(0),y2:Y(0),stroke:"var(--axis)","stroke-width":1.5}));
  let lastM = null, k = 0;
  series[0].points.forEach((p,i) => {
    const m = p.d.slice(0,7);
    if(m !== lastM){
      lastM = m;
      if(i > 2 && i < n-3 && (n < 200 || k % 2 === 0)){
        const tx = svgEl("text",{x:X(i),y:H-6,"text-anchor":"middle",fill:"var(--muted)","font-size":11.5});
        tx.textContent = mlabel(m); svg.appendChild(tx);
      }
      k++;
    }
  });
  for(const s of series){
    const d = s.points.map((p,i) => `${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
    svg.appendChild(svgEl("path",{d, fill:"none", stroke:s.color, "stroke-width":s.stark?2.5:2,

/* ---------- Auswertungen ------------------------------------------------- */
function tagesreihe(f, von, bis){
  const I = idx(), key = f + "|" + von + "|" + bis;
  if(I.reihen[key]) return I.reihen[key];
  const alle = buchungenVon(f);
  let saldo = eroeffnung(f), i = 0; const out = [];
  for(let d = I.start; d <= bis; d = addDays(d,1)){
    while(i < alle.length && alle[i].datum <= d){ saldo += alle[i].betrag; i++; }
    if(d >= von) out.push({d, y:saldo});
  }
  return I.reihen[key] = (out.length ? out : [{d:bis, y:saldo}]);
}
function monatsreihe(f){
  const map = new Map();
  for(const b of buchungenVon(f)){
    if(katById(b.kategorie).typ === "neutral") continue;
    const ym = periodeVon(b);
    if(!map.has(ym)) map.set(ym, {ym, ein:0, aus:0});
    const r = map.get(ym);
    if(b.betrag >= 0) r.ein += b.betrag; else r.aus += -b.betrag;
  }
  return [...map.values()].sort((a,b) => a.ym < b.ym ? -1 : 1);
}
/** Alle Kennzahlen einer Auswahl in einem Durchgang. */
function kennzahlen(f, von, bis){
  const liq = saldoAm(f, bis), vor = saldoAm(f, von);
  let ein = 0, aus = 0;
  for(const b of buchungenVon(f, von, bis)){
    const t = katById(b.kategorie).typ;
    if(t === "neutral") continue;
    if(b.betrag >= 0) ein += b.betrag; else aus += -b.betrag;
  }
  const mr = monatsreihe(f), laufend = datenEnde().slice(0,7);
  const voll = mr.filter(r => r.ym < laufend).slice(-3);
  const avg = voll.length ? voll.reduce((s,r) => s + r.ein - r.aus, 0)/voll.length : 0;
  return { liq, vor, diff: liq-vor, ein, aus, erg: ein-aus, avg, vollN: voll.length,
           reich: avg < 0 ? liq/Math.abs(avg) : null };
}
function wiederkehrend(f){
  const grp = new Map();
  for(const b of buchungenVon(f)){
    if(katById(b.kategorie).typ === "neutral") continue;
    const key = norm(b.gegenpartei) + "|" + b.kategorie + "|" + (b.betrag<0?"a":"e");
    if(!grp.has(key)) grp.set(key, []);
    grp.get(key).push(b);
  }
  const H = datenEnde(), out = [];
  for(const arr of grp.values()){
    if(new Set(arr.map(b => b.datum.slice(0,7))).size < 4) continue;
    const letzte = arr.slice(-6);
    const schnitt = letzte.reduce((s,b) => s + b.betrag, 0)/letzte.length;
    const tage = letzte.map(b => +b.datum.slice(8,10)).sort((a,b) => a-b);
    const tagMed = tage[Math.floor(tage.length/2)];
    let naechste = null;
    for(let k=0;k<2;k++){
      const d = new Date(H+"T00:00:00"); d.setMonth(d.getMonth()+k); d.setDate(Math.min(tagMed,28));
      const s = d.toISOString().slice(0,10);
      if(s > H && s <= addDays(H,30)){ naechste = s; break; }
    }
    if(!naechste) continue;
    out.push({ datum:naechste, name:letzte[letzte.length-1].gegenpartei, kategorie:katById(arr[0].kategorie).name,
               betrag:schnitt, firma:(kontoById(arr[0].konto_id)||{}).firma_id });
  }
  return out.sort((a,b) => a.datum < b.datum ? -1 : 1);
}

    zeile("Ergebnis im Zeitraum", k => (k.erg>=0?"+ ":"− ") + eur(Math.abs(k.erg)), k => k.erg>=0?"up":"down") +
    zeile("Ø Monatsergebnis", k => (k.avg>=0?"+ ":"− ") + eur(Math.abs(k.avg)), k => k.avg>=0?"up":"down") +
    zeile("Reichweite der Mittel", k => k.reich === null ? "unbegrenzt" : mon1(k.reich) + " Mon.") +
    `</tbody>`;

  /* Monate */
  const mrows = monatsreihe(f).slice(-13);
  groupedBars($("ch2"), mrows);
  $("tb2").innerHTML = `<table><thead><tr><th>Monat</th><th class="num">Einnahmen</th><th class="num">Ausgaben</th><th class="num">Ergebnis</th></tr></thead><tbody>` +
    mrows.slice().reverse().map(r => `<tr><td>${mlabel(r.ym)}</td><td class="num">${eur(r.ein)}</td><td class="num">${eur(r.aus)}</td><td class="num ${r.ein-r.aus>=0?"up":"down"}">${eur(r.ein-r.aus)}</td></tr>`).join("") + `</tbody></table>`;

  /* Kategorien */
  const summe = (a,b) => { const m = new Map();
    for(const x of buchungenVon(f,a,b)){ const k = katById(x.kategorie);
      if((k.typ !== "aus" && k.typ !== "offen") || x.betrag >= 0) continue;
      m.set(k.name, (m.get(k.name)||0) + (-x.betrag)); } return m; };
  const vglMoeglich = !!vorVon && vorVon >= start;
  const jetzt = summe(von,bis), vorher = vglMoeglich ? summe(vorVon,von) : new Map();
  const katRows = [...jetzt.entries()].map(([name,wert]) => ({name, wert, vor:vorher.get(name)||null})).sort((a,b) => b.wert-a.wert).slice(0,10);
  $("katHint").textContent = nameVon(f) + " · " + (UI.tage === "alle" ? "gesamter Zeitraum, größte Positionen zuerst."
    : vglMoeglich ? `letzte ${UI.tage} Tage, Vergleich mit den ${UI.tage} Tagen davor.`
    : `letzte ${UI.tage} Tage. Für einen Vergleich mit der Vorperiode fehlen noch Daten.`);
  hBars($("ch3"), katRows, vglMoeglich);

  /* Konten */
  $("tbKonten").innerHTML = `<thead><tr><th>Konto</th><th>Bank</th><th class="num">Saldo</th></tr></thead><tbody>` +
    kontenVon(f).map(k => { const s = saldoKonto(k.konto_id);
      return `<tr><td><span class="dot" style="background:${farbeFirma(k.firma_id)}"></span>${esc(k.bezeichnung)}
        <div class="sub" style="margin-left:16px">${f==="alle" ? esc(firmaById(k.firma_id).name)+" · " : ""}${esc(k.iban||"")}</div></td>
        <td>${esc(k.bank||"")}</td><td class="num ${s<0?"down":""}">${eur(s)}</td></tr>`; }).join("") +
    `<tr><td colspan="2"><b>Summe</b></td><td class="num"><b>${eur(A.liq)}</b></td></tr></tbody>`;

  /* Prognose */
  const wk = f === "alle" ? aktive.flatMap(fi => wiederkehrend(fi.id)).sort((a,b) => a.datum < b.datum ? -1 : 1) : wiederkehrend(f);
  const netto = wk.reduce((s,x) => s + x.betrag, 0);
  $("tbProg").innerHTML = `<thead><tr><th>Fällig</th><th>Position</th><th class="num">Erwartet</th></tr></thead><tbody>` +
    (wk.length ? wk.slice(0,12).map(x => `<tr><td>${dstr(x.datum)}</td>
      <td><span class="dot" style="background:${farbeFirma(x.firma)}"></span>${esc(x.name)}<div class="sub" style="margin-left:16px">${esc(x.kategorie)}</div></td>
      <td class="num ${x.betrag>=0?"up":"down"}">${eur(x.betrag)}</td></tr>`).join("")
      : `<tr><td colspan="3" style="color:var(--muted)">Noch zu wenige Daten für eine Vorschau.</td></tr>`) +
    `<tr><td colspan="2"><b>Erwarteter Stand in 30 Tagen</b></td><td class="num"><b>${eur(A.liq+netto)}</b></td></tr></tbody>`;
}

function dropAktivieren(){
  const d = $("drop"); if(!d) return;
  d.onclick = () => { const f = $("fileHidden"); f.value = ""; f.onchange = e => dateienLesen([...e.target.files]); f.click(); };
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); dateienLesen([...e.dataTransfer.files]); };
}
function dateienLesen(dateien){
  if(!dateien.length) return;
  const stapel = []; let offen = dateien.length;
  dateien.forEach(datei => {
    const r = new FileReader();
    r.onload = () => {
      const text = r.result;
      if(datei.name.toLowerCase().endsWith(".json") && /"buchungen"\s*:/.test(text.slice(0,3000))){
        standLaden(text); if(--offen === 0 && stapel.length) importFertig(stapel); return;
      }
      stapel.push(...stapelAusDatei(text, datei.name));
      if(--offen === 0) importFertig(stapel);
    };
    r.onerror = () => { toast("Datei konnte nicht gelesen werden: " + datei.name); if(--offen === 0) importFertig(stapel); };
    r.readAsText(datei, "utf-8");
  });
}
function importFertig(stapel){
  if(!stapel.length){ toast("In den Dateien wurden keine Umsätze gefunden."); return; }
  stapel.forEach(stapelNeuRechnen);
  UI.imp = { stapel };
  tabWechseln("import");
}
function stapelAusDatei(text, name){
  const art = formatErkennen(text, name);
  if(art === "pdf") return [{ dateiname:name, art:"pdf", roh:[], neu:[], dubletten:0,
    fehler:"Das ist ein PDF. Diese Seite kann nur Dateien lesen, in denen die Zahlen schon als Text stehen – "
         + "CSV, MT940 oder CAMT.053. Bitte im Online-Banking den Umsatz-Export als CSV wählen. "
         + "Geht das nicht, das PDF im Claude-Chat hochladen und in eine CSV umwandeln lassen." }];
  if(art === "excel") return [{ dateiname:name, art:"excel", roh:[], neu:[], dubletten:0,
    fehler:"Excel-Dateien lassen sich hier nicht direkt lesen. Bitte in Excel unter „Speichern unter“ das Format "
         + "CSV (Trennzeichen-getrennt) wählen und die CSV-Datei hochladen." }];
  if(art === "mt940" || art === "camt"){
    const p = art === "mt940" ? parseMT940(text) : parseCAMT(text);
    if(p.fehler) return [{ dateiname:name, art, fehler:p.fehler, roh:[], neu:[], dubletten:0 }];
    return p.auszuege.map(a => ({
      dateiname:name, art, kontoKennung:a.konto || "", konto_id:kontoRaten(a.konto),
      anfang:a.anfang || null, ende:a.ende || null, roh:a.umsaetze, neu:[], dubletten:0, eroeffnungUebernehmen:false
    }));
  }
  const p = parseCSV(text, name);
  if(p.fehler) return [{ dateiname:name, art:"csv", fehler:p.fehler, roh:[], neu:[], dubletten:0 }];
  const roh = csvBuchungen(p);
  const kennung = p.eigenKonto || (roh[0]||{}).kontoHinweis || "";
  return [{ dateiname:name, art:"csv", csv:p, kontoKennung:kennung, konto_id:kontoRaten(kennung),
            anfang:null, ende:null, roh, neu:[], dubletten:0, eroeffnungUebernehmen:false }];
}
function stapelNeuRechnen(st){
  if(st.fehler) return;
  if(st.art === "csv" && st.csv) st.roh = csvBuchungen(st.csv);
  const bekannt = new Set(S.buchungen.map(buSchluessel));
  st.neu = []; st.dubletten = 0;
  const eigen = new Set();
  for(const u of st.roh){
    const b = { datum:u.datum, konto_id:st.konto_id || "?", betrag:Math.round(u.betrag*100)/100,
                gegenpartei:u.gegenpartei || "ohne Angabe", verwendungszweck:u.verwendungszweck || "",
                kategorie:kategorieRaten(u.gegenpartei, u.verwendungszweck) };
    const k = buSchluessel(b);
    if(bekannt.has(k) || eigen.has(k)){ st.dubletten++; continue; }
    eigen.add(k); st.neu.push(b);
  }
  st.summe = st.neu.reduce((s,b) => s + b.betrag, 0);
  st.summeAlle = st.roh.reduce((s,b) => s + b.betrag, 0);
  st.probe = (st.anfang && st.ende) ? Math.round((st.ende.betrag - (st.anfang.betrag + st.summeAlle))*100)/100 : null;
}

function importUebernehmen(){
  const imp = UI.imp; if(!imp) return;
  if(imp.stapel.some(s => !s.fehler && !s.konto_id && s.neu.length)) return toast("Bitte zuerst für jeden Stapel ein Konto wählen.");
  let n = 0, warn = 0;
  const stempel = Date.now().toString(36);
  for(const st of imp.stapel){
    if(st.fehler || !st.neu.length) continue;
    if(st.probe !== null && Math.abs(st.probe) >= 0.005) warn++;
    const ko = kontoById(st.konto_id);
    if(ko && st.eroeffnungUebernehmen && st.anfang){
      ko.eroeffnungssaldo = st.anfang.betrag;
      ko.eroeffnungsdatum = st.anfang.datum;
    }
    for(const b of st.neu){
      b.konto_id = st.konto_id; b.id = "b" + stempel + (n++); b.periode = null;
      S.buchungen.push(b);
    }
  }
  S.buchungen.sort((a,b) => a.datum < b.datum ? -1 : 1);
  UI.imp = null;
  toast(`${n} Buchungen übernommen.` + (warn ? ` Achtung: ${warn} Stapel mit fehlerhafter Saldenprobe.` : ""));
  renderAll(); tabWechseln("uebersicht");
  setTimeout(() => { if(confirm("Datenstand jetzt sichern? Ohne Sicherung gehen die Daten beim Schließen des Fensters verloren.")) standSichern(); }, 400);
}

const PRO_SEITE = 60;
function gefilterte(){
  const f = UI.filter, such = f.text ? norm(f.text) : "";
  const basis = f.konto ? ((kontoById(f.konto)||{}).firma_id || "alle") : "alle";
  return buchungenVon(basis).filter(b => {
    if(f.konto && b.konto_id !== f.konto) return false;
    if(f.kat && b.kategorie !== f.kat) return false;
    if(f.von && b.datum < f.von) return false;
    if(f.bis && b.datum > f.bis) return false;
    if(such && !norm(b.gegenpartei + " " + b.verwendungszweck).includes(such)) return false;
    return true;
  }).slice().reverse();
}
/* Die Auswahlfelder bekommen erst beim Anklicken alle Einträge. Vorher stehen
   in der Tabelle 120 statt über 2000 Optionen – das ist der Unterschied
   zwischen flüssigem und stockendem Blättern. */
let KAT_OPT = "", MON_OPT = [];
function selVollmachen(sel){
  if(sel.dataset.voll) return;
  const wert = sel.value;
  if(sel.classList.contains("katSel")) sel.innerHTML = KAT_OPT;
  else sel.innerHTML = `<option value="">— wie Zahlung (${mlabel(sel.dataset.eigen)}) —</option>` +
    MON_OPT.map(m => `<option value="${m}">${mlabel(m)}</option>`).join("");
  sel.value = wert; sel.dataset.voll = "1";
}
function renderBuchungen(){
  const el = $("tab-buchungen");
  if(!S.buchungen.length){
    el.innerHTML = `<div class="card"><h2>Buchungen</h2><p class="hint">Noch keine Buchungen vorhanden.
      <a href="#" onclick="tabWechseln('import');return false;">Ersten Kontoauszug einlesen</a>.</p></div>`;
    return;
  }
  const altScroll = el.querySelector(".scroll") ? el.querySelector(".scroll").scrollTop : 0;
  const liste = gefilterte();
  const seiten = Math.max(1, Math.ceil(liste.length/PRO_SEITE));
  UI.seite = Math.min(UI.seite, seiten-1);
  const teil = liste.slice(UI.seite*PRO_SEITE, (UI.seite+1)*PRO_SEITE);
  KAT_OPT = S.kategorien.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join("");
  const vorhandene = [...new Set(S.buchungen.map(b => b.datum.slice(0,7)))].sort();

function filterLeeren(){ UI.filter = {konto:"",kat:"",text:"",von:"",bis:""}; UI.seite = 0; renderBuchungen(); }
function kategorieSetzen(id, katId){
  const b = S.buchungen.find(x => x.id === id); if(!b) return;
  const alt = b.kategorie; b.kategorie = katId;
  const gleiche = S.buchungen.filter(x => x.id !== id && x.kategorie !== katId && norm(x.gegenpartei) === norm(b.gegenpartei));
  renderAll();
  if(katId !== "offen" && b.gegenpartei && b.gegenpartei !== "ohne Angabe"){
    modal(`<h2 style="font-size:16px">Zuordnung merken?</h2>
      <p class="hint">„${esc(b.gegenpartei)}“ wurde auf <b>${esc(katById(katId).name)}</b> gesetzt (vorher ${esc(katById(alt).name)}).</p>
      <p style="font-size:13.5px">Soll das Programm sich das merken und künftige Buchungen dieser Gegenpartei automatisch so zuordnen?
        ${gleiche.length ? `<br><br>Es gibt außerdem <b>${gleiche.length} weitere Buchungen</b> derselben Gegenpartei mit anderer Kategorie.` : ""}</p>
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn" onclick="modalZu()">Nur diese eine</button>
        ${gleiche.length ? `<button class="btn" onclick="merken('${esc(id)}','${esc(katId)}',true,false)">Alle ${gleiche.length} mitändern</button>` : ""}
        <button class="btn primary" onclick="merken('${esc(id)}','${esc(katId)}',${gleiche.length?"true":"false"},true)">
          ${gleiche.length ? "Alle ändern und merken" : "Merken"}</button></div>`);
  }
}
function merken(id, katId, alleAendern, regel){
  const b = S.buchungen.find(x => x.id === id); if(!b) return modalZu();
  if(alleAendern) S.buchungen.filter(x => norm(x.gegenpartei) === norm(b.gegenpartei)).forEach(x => x.kategorie = katId);
  if(regel && regelMerken(katId, b.gegenpartei)) toast("Regel gemerkt: „" + b.gegenpartei + "“ → " + katById(katId).name);
  modalZu(); renderAll();
}

        <thead><tr><th>Datum</th><th>Buchung</th><th class="num">Betrag</th><th>zählt bisher zu</th><th>Vorschlag</th><th>Grund</th><th></th></tr></thead>
        <tbody>${v.map(x => { const b = S.buchungen.find(y => y.id === x.id); if(!b) return "";

        </tbody></table></div></div>`
    : `<div class="card"><div class="note ok"><span class="ic">✓</span><span>Zurzeit gibt es nichts abzugrenzen.</span></div></div>`) +
    (zugeordnet.length ? `<div class="card"><h2>Bereits abweichend zugeordnet (${zugeordnet.length})</h2>

function einstellFelder(){
  const j = $("jahrStart"); if(j) j.onchange = () => { S.einstellungen.jahresstart = j.value; renderAll(); };
  const b = $("basisSel"); if(b) b.onchange = () => { S.einstellungen.basis = b.value; renderAll(); };
}
function vorschlag(id, periode, reset){
  const b = S.buchungen.find(x => x.id === id); if(!b) return;
  b.periode = periode; b.abgrErledigt = !reset;
  renderAll();
}
function alleVorschlaege(annehmen){
  const v = abgrenzungsVorschlaege();
  v.forEach(x => { const b = S.buchungen.find(y => y.id === x.id); if(!b) return;
    b.periode = annehmen ? x.vorschlag : null; b.abgrErledigt = true; });
  toast(annehmen ? `${v.length} Buchungen neu zugeordnet.` : `${v.length} Vorschläge abgelehnt.`);
  renderAll();
}

const neueId = p => p + "-" + Math.random().toString(36).slice(2,7);
function firmaNeu(){ S.firmen.push({id:neueId("f"), name:"Neue Gesellschaft"}); renderAll(); }
function firmaLoeschen(id){
  if(kontenVon(id).length) return toast("Diese Gesellschaft hat noch Konten. Zuerst die Konten löschen oder umhängen.");
  S.firmen = S.firmen.filter(f => f.id !== id); renderAll();
}
function kontoNeu(){
  if(!S.firmen.length) return toast("Zuerst eine Gesellschaft anlegen.");
  S.konten.push({ konto_id:neueId("k"), firma_id:S.firmen[0].id, bezeichnung:"Geschäftskonto",
    bank:"", iban:"", typ:"giro", eroeffnungssaldo:0, eroeffnungsdatum:S.einstellungen.jahresstart });
  renderAll();
}
function kontoLoeschen(id){
  const n = S.buchungen.filter(b => b.konto_id === id).length;
  if(n && !confirm(`Zu diesem Konto gehören ${n} Buchungen. Konto und Buchungen wirklich löschen?`)) return;
  S.konten = S.konten.filter(k => k.konto_id !== id);
  S.buchungen = S.buchungen.filter(b => b.konto_id !== id);
  renderAll();
}

/* ---------- Zeitraum ------------------------------------------------------ */
function alleMonate(){
  const a = datenStart().slice(0,7), b = datenEnde().slice(0,7);
  const out = []; let m = a;
  let schutz = 0;
  while(m <= b && schutz++ < 600){ out.push(m); m = addMon(m,1); }
  return out.length ? out : [b];
}
function monatsWerte(f){
  const mon = alleMonate(), map = new Map(mon.map(m => [m, {ym:m, ein:0, aus:0, netto:0}]));
  for(const b of buchungenVon(f)){
    if(katById(b.kategorie).typ === "neutral") continue;
    const r = map.get(periodeVon(b)); if(!r) continue;
    if(b.betrag >= 0) r.ein += b.betrag; else r.aus += -b.betrag;
  }
  const liste = mon.map(m => map.get(m));
  liste.forEach(r => r.netto = r.ein - r.aus);
  return liste;
}
/** Erster und letzter Tag des gewählten Monatsbereichs. */
function zeitraumTage(){
  const von = UI.mVon + "-01";
  const j = +UI.mBis.slice(0,4), m = +UI.mBis.slice(5,7);
  const letzter = new Date(Date.UTC(j, m, 0)).toISOString().slice(0,10);
  return { von, bis: letzter > datenEnde() ? datenEnde() : letzter };
}
function zeitraumPruefen(){
  const mon = alleMonate();
  if(!UI.mVon || !mon.includes(UI.mVon) || !UI.mBis || !mon.includes(UI.mBis) || UI.mVon > UI.mBis){
    const laufend = datenEnde().slice(0,7);
    const vollstaendig = mon.filter(m => m < laufend);
    const ziel = vollstaendig.length ? vollstaendig[vollstaendig.length-1] : mon[mon.length-1];
    UI.mVon = UI.mBis = ziel;
  }
}
const zeitraumName = () => UI.mVon === UI.mBis ? mlabel(UI.mVon) : mlabel(UI.mVon) + " bis " + mlabel(UI.mBis);

/* ---------- Kategoriesummen im Zeitraum ---------------------------------- */
/** Nettosumme je Kategorie. Alle Kategorien, auch neutrale – nur so geht die
    Rechnung Anfangsbestand + Kategorien = Endbestand exakt auf. */
function katSummen(f, von, bis){
  const m = new Map();
  for(const b of buchungenVon(f, von, bis)){
    const k = katById(b.kategorie);
    if(!m.has(k.id)) m.set(k.id, {id:k.id, name:k.name, typ:k.typ, netto:0, ein:0, aus:0, n:0});
    const r = m.get(k.id);
    r.netto += b.betrag; r.n++;
    if(b.betrag >= 0) r.ein += b.betrag; else r.aus += -b.betrag;
  }
  return [...m.values()];
}

/* ---------- Monatsleiste (anklickbar und ziehbar) ------------------------- */
function monatsLeiste(host, werte){
  host.innerHTML = "";
  const W = host.clientWidth || 900, H = 96, P = {t:14, b:20, l:0, r:0};
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`, height:H, style:"cursor:pointer"}); host.appendChild(svg);
  const max = Math.max(1, ...werte.map(r => Math.abs(r.netto)));
  const bw = W/werte.length;
  const mitte = P.t + (H-P.t-P.b)/2;
  const hoehe = v => (H-P.t-P.b)/2 * Math.min(1, Math.abs(v)/max);
  svg.appendChild(svgEl("line",{x1:0, x2:W, y1:mitte, y2:mitte, stroke:"var(--axis)", "stroke-width":1}));
  werte.forEach((r,i) => {
    const drin = r.ym >= UI.mVon && r.ym <= UI.mBis;
    const x = i*bw;
    if(drin) svg.appendChild(svgEl("rect",{x:x+1, y:2, width:bw-2, height:H-4, fill:"var(--chip2)", rx:6}));
    const h = Math.max(2, hoehe(r.netto)), pos = r.netto >= 0;
    svg.appendChild(svgEl("rect",{ x:x + bw*0.28, y: pos ? mitte-h : mitte, width: Math.max(4, bw*0.44), height:h,
      fill: pos ? "var(--pos)" : "var(--neg)", rx:3, opacity: drin ? 1 : .5 }));
    const jeder = Math.ceil(werte.length/9);
    if(i % jeder === 0 || i === werte.length-1 || drin){
      const tx = svgEl("text",{x:x+bw/2, y:H-5, "text-anchor":"middle", "font-size":10.5,
        fill: drin ? "var(--ink)" : "var(--muted)", "font-weight": drin ? 650 : 400});
      tx.textContent = mlabel(r.ym); svg.appendChild(tx);
    }
    const hit = svgEl("rect",{x, y:0, width:bw, height:H, fill:"transparent"});
    hit.dataset.ym = r.ym;
    hit.addEventListener("mousemove", ev => showTT(ev.clientX, ev.clientY,
      `<b>${mlabel(r.ym)}</b><div class="r"><span>Einnahmen</span><span>${eur(r.ein)}</span></div>`+
      `<div class="r"><span>Ausgaben</span><span>${eur(r.aus)}</span></div>`+
      `<div class="r" style="border-top:1px solid var(--grid);margin-top:4px;padding-top:4px"><span>Ergebnis</span><span>${eur(r.netto)}</span></div>`));
    hit.addEventListener("mouseleave", hideTT);
    svg.appendChild(hit);
  });
  /* Ziehen über mehrere Monate. Der Startmonat liegt bewusst außerhalb dieser
     Funktion: Während des Ziehens wird die Leiste neu gezeichnet, und eine
     Variable innerhalb der Funktion wäre danach wieder leer. */
  const ymAus = ev => { const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset ? el.dataset.ym : null; };
  svg.addEventListener("mousedown", ev => { const y = ymAus(ev); if(!y) return;
    ZIEH = y; UI.mVon = UI.mBis = y; ev.preventDefault(); leisteAktualisieren(); });
  svg.addEventListener("mousemove", ev => { if(ZIEH === null) return;
    const y = ymAus(ev); if(!y) return;
    const a = ZIEH < y ? ZIEH : y, z = ZIEH < y ? y : ZIEH;
    if(a !== UI.mVon || z !== UI.mBis){ UI.mVon = a; UI.mBis = z; leisteAktualisieren(); } });
}
let ZIEH = null;
/** Während des Ziehens nur die Leiste und die Anzeige auffrischen – die
    schweren Diagramme werden erst beim Loslassen neu gerechnet. */
function leisteAktualisieren(){
  const host = $("mleiste"); if(!host) return;

  const g = $("gewaehlt");

}
