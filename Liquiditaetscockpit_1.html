/* ---------- Wasserfall ---------------------------------------------------- */
/** Zu viele Stufen machen die Beschriftung unlesbar – die kleinsten wandern in
    eine Sammelstufe. Die Summe bleibt dabei unverändert, die Rechnung geht weiter auf. */
function postenFalten(posten, maxN){
  if(posten.length <= maxN) return posten;
  const gross = new Set([...posten].sort((a,b) => Math.abs(b.netto)-Math.abs(a.netto)).slice(0, maxN-1));
  const rest = posten.filter(p => !gross.has(p));
  const out = posten.filter(p => gross.has(p));
  out.push({ id:null, name:"Übrige (" + rest.length + ")", typ:"aus",
             netto: rest.reduce((s,p) => s+p.netto, 0), n: rest.reduce((s,p) => s+p.n, 0) });
  return out;
}
function wasserfall(host, anfang, posten, ende, nurFluss){
  host.innerHTML = "";
  const W = host.clientWidth || 900;
  const P = {t:30, r:14, b:78, l:74};
  const spalten = posten.length + (nurFluss ? 1 : 2);
  const H = 340;
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`, height:H}); host.appendChild(svg);
  /* Kumulierter Verlauf für die Skala */
  let lauf = anfang; const stufen = [];
  for(const p of posten){ stufen.push({...p, von:lauf, bis:lauf + p.netto}); lauf += p.netto; }
  const werte = [anfang, ende, ...stufen.flatMap(s => [s.von, s.bis])];
  const {ticks, lo, hi} = niceTicks(Math.min(0, ...werte), Math.max(...werte), 4);
  const Y = v => P.t + (H-P.t-P.b) * (1 - (v-lo)/(hi-lo||1));
  const bw = (W-P.l-P.r)/spalten;
  for(const t of ticks){
    svg.appendChild(svgEl("line",{x1:P.l, x2:W-P.r, y1:Y(t), y2:Y(t), stroke:"var(--grid)", "stroke-width":1}));
    const tx = svgEl("text",{x:P.l-9, y:Y(t)+4, "text-anchor":"end", fill:"var(--muted)", "font-size":11}); tx.textContent = eurK(t); svg.appendChild(tx);
  }
  const balken = [
    ...(nurFluss ? [] : [{name:"Anfangsbestand", von:0, bis:anfang, art:"summe", betrag:anfang}]),
    ...stufen.map(s => ({name:s.name, von:s.von, bis:s.bis, art:s.netto>=0?"ein":"aus", betrag:s.netto, id:s.id, n:s.n})),
    {name: nurFluss ? "Veränderung gesamt" : "Endbestand", von:0, bis:ende, art:"summe", betrag:ende}
  ];
  balken.forEach((b,i) => {
    const x = P.l + i*bw + bw*0.16, breite = bw*0.68;
    const y1 = Y(b.von), y2 = Y(b.bis);
    const y = Math.min(y1,y2), h = Math.max(2, Math.abs(y2-y1));
    const farbe = b.art === "summe" ? "var(--ink2)" : b.art === "ein" ? "var(--pos)" : "var(--neg)";
    const rect = svgEl("rect",{x, y, width:breite, height:h, fill:farbe, rx:Math.min(4, breite/2),
      style: b.id ? "cursor:pointer" : ""});
    rect.addEventListener("mousemove", ev => showTT(ev.clientX, ev.clientY,
      `<b>${esc(b.name)}</b><div class="r"><span>${b.art==="summe" ? "Bestand" : "Veränderung"}</span><span>${eur(b.betrag,2)}</span></div>` +
      (b.n ? `<div class="r"><span>Buchungen</span><span>${b.n}</span></div><div class="r" style="color:var(--muted);margin-top:3px"><span>Klicken für Einzelbuchungen</span></div>` : "")));
    rect.addEventListener("mouseleave", hideTT);
    if(b.id) rect.addEventListener("click", () => drilldown(b.id));
    svg.appendChild(rect);
    /* Verbindungslinie zur nächsten Stufe */
    if(i < balken.length-1 && (b.art !== "summe" || (i === 0 && !nurFluss))){
      const yv = Y(b.bis);
      svg.appendChild(svgEl("line",{x1:x+breite, x2:P.l+(i+1)*bw+bw*0.16, y1:yv, y2:yv,
        stroke:"var(--axis)", "stroke-width":1}));
    }
    /* Beschriftung: Wert über/unter dem Balken, Name schräg darunter */
    const tw = svgEl("text",{x:x+breite/2, y: (b.art==="aus" ? y+h+13 : y-8),
      "text-anchor":"middle", "font-size":10.5, fill:"var(--ink2)", "font-weight":600});
    tw.textContent = (b.art === "summe" && !nurFluss ? "" : b.betrag >= 0 ? "+" : "−") + eurK(Math.abs(b.betrag));
    svg.appendChild(tw);
    const tn = svgEl("text",{x:0, y:0, "text-anchor":"end", "font-size":10.5, fill:"var(--muted)",
      transform:`translate(${x+breite/2+4},${H-P.b+16}) rotate(-38)`});
    tn.textContent = b.name.length > 26 ? b.name.slice(0,25)+"…" : b.name;
    svg.appendChild(tn);
  });
}

/* ---------- Geldstrom-Diagramm (Sankey) ----------------------------------- */
/** Baut Knoten und Verbindungen. Links Einnahmequellen, Mitte Gesellschaften,
    rechts Ausgaben. Die Bilanz wird über einen Ausgleichsknoten geschlossen. */
function stroemeDaten(f, von, bis){
  const firmen = f === "alle" ? S.firmen.filter(x => kontenVon(x.id).length) : [firmaById(f)];
  const knoten = new Map(), links = [];
  const K = (id, name, seite, farbe) => { if(!knoten.has(id)) knoten.set(id,{id,name,seite,farbe,wert:0}); return knoten.get(id); };
  const L = (q, z, wert) => { if(wert > 0.005) links.push({q, z, wert}); };

  for(const fi of firmen){
    const mid = "f:"+fi.id;
    K(mid, fi.name, 1, farbeFirma(fi.id));
    const ein = new Map(), aus = new Map();
    for(const b of buchungenVon(fi.id, von, bis)){
      const k = katById(b.kategorie);
      if(k.typ === "neutral") continue;
      if(b.betrag >= 0) ein.set(k.id, (ein.get(k.id)||0) + b.betrag);
      else aus.set(k.id, (aus.get(k.id)||0) + (-b.betrag));
    }
    let summeEin = 0, summeAus = 0;
    for(const [kid, v] of ein){ K("e:"+kid, katById(kid).name, 0, "var(--pos)"); L("e:"+kid, mid, v); summeEin += v; }
    for(const [kid, v] of aus){ K("a:"+kid, katById(kid).name, 2, "var(--neg)"); L(mid, "a:"+kid, v); summeAus += v; }
    if(summeEin - summeAus > 0.005){
      K("a:__auf", "Liquiditätsaufbau", 2, "var(--ink2)"); L(mid, "a:__auf", summeEin - summeAus);
    } else if(summeAus - summeEin > 0.005){
      K("e:__zehr", "aus dem Bestand gedeckt", 0, "var(--ink2)"); L("e:__zehr", mid, summeAus - summeEin);
    }
  }
  for(const l of links){ knoten.get(l.q).wert += l.wert; }
  for(const n of knoten.values()) if(n.seite === 2) n.wert = links.filter(l => l.z === n.id).reduce((s,l) => s+l.wert, 0);
  for(const n of knoten.values()) if(n.seite === 1) n.wert = links.filter(l => l.z === n.id).reduce((s,l) => s+l.wert, 0);
  /* Kleinste Kategorien zusammenfassen, damit das Bild lesbar bleibt */
  for(const seite of [0,2]){
    const liste = [...knoten.values()].filter(n => n.seite === seite && !n.id.includes("__")).sort((a,b) => b.wert-a.wert);
    if(liste.length <= 8) continue;
    const rest = liste.slice(7);
    const sammelId = seite === 0 ? "e:__rest" : "a:__rest";
    K(sammelId, "Übrige (" + rest.length + ")", seite, seite === 0 ? "var(--pos)" : "var(--neg)");
    for(const r of rest){
      links.forEach(l => { if(l.q === r.id) l.q = sammelId; if(l.z === r.id) l.z = sammelId; });
      knoten.get(sammelId).wert += r.wert;
      knoten.delete(r.id);
    }
  }
  /* Gleiche Quelle-Ziel-Paare zusammenfassen */
  const zus = new Map();
  for(const l of links){ const k = l.q+">"+l.z; zus.set(k, (zus.get(k)||0) + l.wert); }
  const links2 = [...zus.entries()].map(([k,v]) => ({q:k.split(">")[0], z:k.split(">")[1], wert:v}));
  return { knoten:[...knoten.values()], links:links2 };
}

function sankey(host, daten){
  host.innerHTML = "";
  if(!daten.links.length){ host.innerHTML = '<p class="hint">Im gewählten Zeitraum gab es keine Bewegungen.</p>'; return; }
  const proSeite = [0,1,2].map(s => daten.knoten.filter(n => n.seite === s));
  const maxZeilen = Math.max(...proSeite.map(a => a.length));
  const W = host.clientWidth || 900;
  const H = Math.max(380, maxZeilen*42 + 40);
  const P = {t:14, b:14, l:Math.min(230, W*0.26), r:Math.min(230, W*0.26)};
  const NB = 12;                       // Knotenbreite
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`, height:H}); host.appendChild(svg);
  const spaltenX = [P.l, W/2 - NB/2, W-P.r-NB];
  const gesamt = proSeite[1].reduce((s,n) => s+n.wert, 0) || 1;
  const luecke = 9;
  const platz = s => H - P.t - P.b - Math.max(0, proSeite[s].length-1)*luecke;
  const skala = Math.min(...[0,1,2].map(s => platz(s) / (proSeite[s].reduce((a,n)=>a+n.wert,0) || 1)));

  for(const s of [0,1,2]){
    const liste = proSeite[s].sort((a,b) => b.wert - a.wert);
    const gesamtH = liste.reduce((a,n) => a + n.wert*skala, 0) + Math.max(0, liste.length-1)*luecke;
    let y = P.t + (H - P.t - P.b - gesamtH)/2;
    for(const n of liste){ n.y = y; n.h = Math.max(4, n.wert*skala); n.x = spaltenX[s]; y += n.h + luecke; }
  }
  const byId = Object.fromEntries(daten.knoten.map(n => [n.id, n]));
  /* Andockpunkte: Verbindungen an jedem Knoten nach der Lage der Gegenseite stapeln */
  for(const n of daten.knoten){
    const raus = daten.links.filter(l => l.q === n.id).sort((a,b) => byId[a.z].y - byId[b.z].y);
    let o = 0; for(const l of raus){ l.qy = n.y + o; o += l.wert*skala; }
    const rein = daten.links.filter(l => l.z === n.id).sort((a,b) => byId[a.q].y - byId[b.q].y);
    o = 0; for(const l of rein){ l.zy = n.y + o; o += l.wert*skala; }
  }
  /* Bänder */
  const bandGruppe = svgEl("g"); svg.appendChild(bandGruppe);
  for(const l of daten.links){
    const q = byId[l.q], z = byId[l.z];
    const x0 = q.x + NB, x1 = z.x, xm = (x0+x1)/2;
    const h = Math.max(1.5, l.wert*skala);
    const d = `M${x0},${l.qy} C${xm},${l.qy} ${xm},${l.zy} ${x1},${l.zy}`+
              ` L${x1},${l.zy+h} C${xm},${l.zy+h} ${xm},${l.qy+h} ${x0},${l.qy+h} Z`;
    const p = svgEl("path",{d, fill: q.seite === 0 ? "var(--pos)" : "var(--neg)", opacity:.34});
    p.addEventListener("mouseenter", () => p.setAttribute("opacity", .68));
    p.addEventListener("mousemove", ev => showTT(ev.clientX, ev.clientY,
      `<b>${eur(l.wert)}</b><div class="r"><span>von</span><span>${esc(q.name)}</span></div>`+
      `<div class="r"><span>nach</span><span>${esc(z.name)}</span></div>`+
      `<div class="r"><span>Anteil</span><span>${(l.wert/gesamt*100).toFixed(1)} %</span></div>`));
    p.addEventListener("mouseleave", () => { p.setAttribute("opacity", .34); hideTT(); });
    bandGruppe.appendChild(p);
  }
  /* Beschriftungen entzerren: zwei Zeilen je Knoten brauchen Platz, kleine
     Knoten liegen sonst übereinander. */
  const ABSTAND = 30;
  for(const s of [0,2]){
    const liste = proSeite[s].slice().sort((a,b) => a.y - b.y);
    let vorher = -1e9;
    for(const n of liste){ n.ly = Math.max(n.y + n.h/2, vorher + ABSTAND); vorher = n.ly; }
    let grenze = H - 10;
    for(let i = liste.length-1; i >= 0; i--){ liste[i].ly = Math.min(liste[i].ly, grenze); grenze = liste[i].ly - ABSTAND; }
  }
  /* Knoten und Beschriftung */
  for(const n of daten.knoten){
    const r = svgEl("rect",{x:n.x, y:n.y, width:NB, height:n.h, fill:n.farbe, rx:3,
      style: n.id.includes("__") ? "" : "cursor:pointer"});
    r.addEventListener("mousemove", ev => showTT(ev.clientX, ev.clientY,
      `<b>${esc(n.name)}</b><div class="r"><span>${n.seite===1?"Durchfluss":"Betrag"}</span><span>${eur(n.wert)}</span></div>`+
      `<div class="r"><span>Anteil</span><span>${(n.wert/gesamt*100).toFixed(1)} %</span></div>`+
      (n.id.includes("__") ? "" : `<div class="r" style="color:var(--muted);margin-top:3px"><span>Klicken für Einzelbuchungen</span></div>`)));
    r.addEventListener("mouseleave", hideTT);
    if(!n.id.includes("__")) r.addEventListener("click", () => {
      if(n.seite === 1){ UI.firma = n.id.slice(2); renderStroeme(); } else drilldown(n.id.slice(2), n.seite === 0 ? "ein" : "aus");
    });
    svg.appendChild(r);
    const rechts = n.seite === 2;
    const mitte = n.seite === 1;
    const lx = mitte ? n.x + NB/2 : (rechts ? n.x + NB + 10 : n.x - 10);
    const ly = mitte ? n.y + n.h/2 : n.ly;
    /* Hilfslinie, wenn die Beschriftung ausweichen musste */
    if(!mitte && Math.abs(ly - (n.y + n.h/2)) > 4){
      svg.appendChild(svgEl("line",{ x1: rechts ? n.x+NB : n.x, x2: rechts ? n.x+NB+6 : n.x-6,
        y1: n.y + n.h/2, y2: ly - 4, stroke:"var(--axis)", "stroke-width":1 }));
    }
    const halo = mitte ? {stroke:"var(--surface)", "stroke-width":3.5, "paint-order":"stroke"} : {};
    const tx = svgEl("text", Object.assign({ x:lx, y: mitte ? ly - 11 : ly - 1,
      "text-anchor": mitte ? "middle" : (rechts ? "start" : "end"),
      "font-size":11.5, fill:"var(--ink)" }, halo));
    tx.textContent = n.name.length > 30 ? n.name.slice(0,29)+"…" : n.name;
    svg.appendChild(tx);
    const tv = svgEl("text", Object.assign({ x:lx, y: mitte ? ly + 4 : ly + 12,
      "text-anchor": mitte ? "middle" : (rechts ? "start" : "end"),
      "font-size":11, fill:"var(--muted)", class:"mono" }, halo));
    tv.textContent = eur(n.wert);
    svg.appendChild(tv);
  }
}

/* ---------- Drilldown ----------------------------------------------------- */
function drilldown(katId, richtung){
  const {von, bis} = zeitraumTage();
  const k = katById(katId);
  let liste = buchungenVon(UI.firma, von, bis).filter(b => b.kategorie === katId);
  if(richtung === "ein") liste = liste.filter(b => b.betrag >= 0);
  if(richtung === "aus") liste = liste.filter(b => b.betrag < 0);
  liste.sort((a,b) => Math.abs(b.betrag) - Math.abs(a.betrag));
  const summe = liste.reduce((s,b) => s+b.betrag, 0);
  modal(`<div class="row"><h2 style="font-size:16px;margin:0">${esc(k.name)}</h2><span class="spacer"></span>
      <button class="btn sm" onclick="modalZu()">Schließen</button></div>
    <p class="hint">${zeitraumName()} · ${UI.firma === "alle" ? "alle Gesellschaften" : esc(firmaById(UI.firma).name)} ·
      ${liste.length} Buchungen · Summe <b>${eur(summe,2)}</b></p>
    <div class="scroll" style="max-height:52vh"><table>
      <thead><tr><th>Datum</th><th>Zahlungspartner</th><th>Konto</th><th class="num">Betrag</th></tr></thead>
      <tbody>${liste.slice(0,300).map(b => { const ko = kontoById(b.konto_id) || {};
        return `<tr><td class="mono">${dstr(b.datum)}</td>
          <td>${esc(b.gegenpartei)}<div class="sub">${esc(b.verwendungszweck).slice(0,80)}</div></td>
          <td class="sub">${esc(ko.bezeichnung||"")}</td>
          <td class="num ${b.betrag>=0?"up":""}">${eur(b.betrag,2)}</td></tr>`; }).join("") ||
        `<tr><td colspan="4" style="color:var(--muted)">Keine Buchungen in diesem Zeitraum.</td></tr>`}
      </tbody></table></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn" onclick="modalZu();UI.filter={konto:'',kat:'${esc(katId)}',text:'',von:'${von}',bis:'${bis}'};UI.seite=0;tabWechseln('buchungen')">
        In der Buchungsliste öffnen und bearbeiten</button></div>`);
}

/* ---------- Zahlungspartner ---------------------------------------------- */
function partnerListe(f, von, bis, richtung){
  const m = new Map();
  for(const b of buchungenVon(f, von, bis)){
    const k = katById(b.kategorie);
    if(k.typ === "neutral") continue;
    if(richtung === "ein" ? b.betrag < 0 : b.betrag >= 0) continue;
    const key = norm(b.gegenpartei) || "ohne angabe";
    if(!m.has(key)) m.set(key, {name:b.gegenpartei, wert:0, n:0});
    const r = m.get(key); r.wert += Math.abs(b.betrag); r.n++;
  }
  return [...m.values()].sort((a,b) => b.wert - a.wert).slice(0,8);
}
function partnerHTML(rows, farbe){
  if(!rows.length) return '<p class="hint">Keine Bewegungen im Zeitraum.</p>';
  const max = Math.max(...rows.map(r => r.wert));
  return rows.map(r => `<div style="margin-bottom:9px">
    <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:3px">
      <span>${esc(r.name)}</span><span class="mono" style="color:var(--ink2)">${eur(r.wert)}<span class="sub"> · ${r.n}×</span></span></div>
    <div style="height:7px;background:var(--chip);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${Math.max(1.5, r.wert/max*100)}%;background:${farbe};border-radius:4px"></div></div></div>`).join("");
}

/* ---------- Der Tab ------------------------------------------------------- */
function renderStroeme(){
  const el = $("tab-stroeme");
  if(!S.buchungen.length){
    el.innerHTML = `<div class="card"><h2>Geldströme</h2><p class="hint">Noch keine Buchungen vorhanden.
      <a href="#" onclick="tabWechseln('import');return false;">Ersten Kontoauszug einlesen</a>
      oder <a href="#" onclick="demoLaden();return false;">Beispieldaten ansehen</a>.</p></div>`;
    return;
  }
  zeitraumPruefen();
  const f = UI.firma, {von, bis} = zeitraumTage();
  const aktive = S.firmen.filter(fi => kontenVon(fi.id).length);
  const anfang = saldoAm(f, addDays(von,-1));
  const ende = saldoAm(f, bis);
  const summen = katSummen(f, von, bis);
  const ein = summen.filter(s => s.netto > 0).sort((a,b) => b.netto-a.netto);
  const aus = summen.filter(s => s.netto < 0).sort((a,b) => a.netto-b.netto);
  const einSumme = summen.filter(s => s.typ !== "neutral").reduce((s,x) => s+x.ein, 0);
  const ausSumme = summen.filter(s => s.typ !== "neutral").reduce((s,x) => s+x.aus, 0);
  const posten = [...ein, ...aus].filter(p => Math.abs(p.netto) > 0.005);
  const tage = Math.round((new Date(bis) - new Date(von))/86400000) + 1;

  el.innerHTML = `
  <div class="card">
    <div class="row" style="align-items:flex-end">
      <div><h2>Zeitraum wählen</h2>
        <p class="hint" style="margin:0">Einen Monat anklicken oder mit gedrückter Maustaste über mehrere Monate ziehen.</p></div>
      <div class="spacer"></div>
      <div class="seg" id="segFirma2"></div>
    </div>
    <div id="mleiste" style="margin-top:10px"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" data-schnell="voll">Letzter voller Monat</button>
      <button class="btn sm" data-schnell="3">Letzte 3 Monate</button>
      <button class="btn sm" data-schnell="12">Letzte 12 Monate</button>
      <button class="btn sm" data-schnell="alles">Alles</button>
      <span class="spacer"></span>
      <span class="sub" id="gewaehlt">Gewählt: <b>${zeitraumName()}</b> · ${dstr(von)} bis ${dstr(bis)} · ${tage} Tage</span>
    </div>
  </div>

  <div class="kpis" style="margin-top:12px">
    <div class="card kpi"><div class="lab">Anfangsbestand</div><div class="val">${eur(anfang)}</div>
      <div class="kpisub">Stand ${dstr(addDays(von,-1))}</div></div>
    <div class="card kpi"><div class="lab">Einnahmen im Zeitraum</div><div class="val up">${eur(einSumme)}</div>
      <div class="kpisub">${summen.filter(s => s.typ !== "neutral" && s.ein > 0).length} Kategorien mit Zufluss</div></div>
    <div class="card kpi"><div class="lab">Ausgaben im Zeitraum</div><div class="val down">${eur(ausSumme)}</div>
      <div class="kpisub">${summen.filter(s => s.typ !== "neutral" && s.aus > 0).length} Kategorien mit Abfluss</div></div>
    <div class="card kpi"><div class="lab">Endbestand</div><div class="val">${eur(ende)}</div>
      <div class="kpisub ${ende-anfang>=0?"up":"down"}">${ende-anfang>=0?"▲":"▼"} ${eur(Math.abs(ende-anfang))} gegenüber Anfang</div></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>Woher das Geld kam und wohin es ging</h2>
    <p class="hint">${zeitraumName()} · Bandbreite entspricht dem Betrag · auf eine Kategorie klicken zeigt die Einzelbuchungen.
      Interne Umbuchungen zwischen eigenen Konten sind herausgerechnet.</p>
    <div class="legend"><span><i class="swatch" style="background:var(--pos)"></i>Zuflüsse</span>
      <span><i class="swatch" style="background:var(--neg)"></i>Abflüsse</span>
      <span><i class="swatch" style="background:var(--ink2)"></i>Ausgleich (Aufbau oder Verzehr des Bestands)</span></div>
    <div id="sankey"></div>
    <details class="tbl"><summary>Als Tabelle anzeigen</summary><div class="scroll" id="tbStrom"></div></details>
  </div>

  <div class="card">
    <div class="row"><div><h2>Was den Bestand verändert hat</h2>
      <p class="hint" style="margin:0">Jede Stufe ist eine Kategorie. ${UI.wfModus === "fluss"
        ? "Die Stufen addieren sich zur Veränderung des Zeitraums – so sind auch kleine Posten gut zu sehen."
        : "Anfangsbestand plus alle Stufen ergibt exakt den Endbestand – zeigt, wie klein die Bewegungen gegenüber dem Bestand sind."}</p></div>
      <div class="spacer"></div>
      <div class="seg" id="segWf">
        <button data-w="fluss" aria-pressed="${UI.wfModus==="fluss"}">nur Veränderungen</button>
        <button data-w="bestand" aria-pressed="${UI.wfModus==="bestand"}">mit Beständen</button></div></div>
    <div id="wasser" style="margin-top:10px"></div>
    <details class="tbl"><summary>Als Tabelle anzeigen</summary><div class="scroll" id="tbWasser"></div></details>
  </div>

  <div class="grid2">
    <section class="card"><h2>Größte Zahlungseingänge</h2>
      <p class="hint">Nach Zahlungspartner, ${zeitraumName()}</p><div id="pEin"></div></section>
    <section class="card"><h2>Größte Zahlungsausgänge</h2>
      <p class="hint">Nach Zahlungspartner, ${zeitraumName()}</p><div id="pAus"></div></section>
  </div>`;

  const sf = $("segFirma2");
  [{id:"alle", name:"Alle Firmen"}, ...aktive].forEach(x => {
    const b = document.createElement("button"); b.textContent = x.name;
    b.setAttribute("aria-pressed", UI.firma === x.id);
    b.onclick = () => { UI.firma = x.id; renderStroeme(); }; sf.appendChild(b);
  });
  el.querySelectorAll("[data-schnell]").forEach(b => b.onclick = () => {
    const mon = alleMonate(), laufend = datenEnde().slice(0,7);
    const s = b.dataset.schnell;
    if(s === "alles"){ UI.mVon = mon[0]; UI.mBis = mon[mon.length-1]; }
    else if(s === "voll"){ const v = mon.filter(m => m < laufend); UI.mVon = UI.mBis = v.length ? v[v.length-1] : mon[mon.length-1]; }
    else { const n = +s; UI.mBis = mon[mon.length-1]; UI.mVon = mon[Math.max(0, mon.length-n)]; }
    renderStroeme();
  });

  monatsLeiste($("mleiste"), monatsWerte(f));
  const strom = stroemeDaten(f, von, bis);
  sankey($("sankey"), strom);
  $("tbStrom").innerHTML = `<table><thead><tr><th>von</th><th>nach</th><th class="num">Betrag</th></tr></thead><tbody>` +
    strom.links.slice().sort((a,b) => b.wert-a.wert).map(l => {
      const q = strom.knoten.find(n => n.id === l.q), z = strom.knoten.find(n => n.id === l.z);
      return `<tr><td>${esc(q.name)}</td><td>${esc(z.name)}</td><td class="num">${eur(l.wert,2)}</td></tr>`; }).join("") +
    `</tbody></table>`;

  $("segWf").onclick = e => { const b = e.target.closest("button"); if(b){ UI.wfModus = b.dataset.w; renderStroeme(); } };
  const wfPosten = postenFalten(posten, 12);
  if(UI.wfModus === "fluss") wasserfall($("wasser"), 0, wfPosten, ende - anfang, true);
  else wasserfall($("wasser"), anfang, wfPosten, ende, false);
  $("tbWasser").innerHTML = `<table><thead><tr><th>Stufe</th><th class="num">Betrag</th><th class="num">Stand danach</th></tr></thead><tbody>` +
    `<tr><td><b>Anfangsbestand</b></td><td class="num">—</td><td class="num mono"><b>${eur(anfang,2)}</b></td></tr>` +
    posten.reduce((acc,p) => { acc.lauf += p.netto;
      acc.html += `<tr><td>${esc(p.name)}</td><td class="num ${p.netto>=0?"up":"down"}">${eur(p.netto,2)}</td>
        <td class="num mono">${eur(acc.lauf,2)}</td></tr>`; return acc; }, {lauf:anfang, html:""}).html +
    `<tr><td><b>Endbestand</b></td><td class="num">—</td><td class="num mono"><b>${eur(ende,2)}</b></td></tr></tbody></table>`;

  $("pEin").innerHTML = partnerHTML(partnerListe(f, von, bis, "ein"), "var(--pos)");
  $("pAus").innerHTML = partnerHTML(partnerListe(f, von, bis, "aus"), "var(--neg)");
}


</script>
</body>
</html>
